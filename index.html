<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>TextGames</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <script src="js/depth.js"></script>
  <script src="js/input.js"></script>
  <script src="js/curve.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/map.js"></script>
  <script src="js/util.js"></script>
  <script src="js/defs.js"></script>
  <script src="js/play.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/sound.js"></script>

  <body onload="start()">
    <div id="menu" class="menu hide"></div>
    <div id="scene" class="scene"></div>
    <div id="topbar" class="closed">
      <div id="tbox">
        <div id="title">Level Name</div>
        <div id="top">
          <div id="s0" class="st"><div>Prize</div></div>
          <div id="s1" class="st"><div>Prize</div></div>
          <div id="s2" class="st"><div>Prize</div></div>
          <div id="s3" class="st"><div id="tl1">21s</div></div>
          <div id="s4" class="st"><div id="tl2">18s</div></div>
          <div id="time"></div>
        </div>
        <div id="best">Your best <span id="bst">★★★</span></div>
      </div>
      <div id="cmds">
        <div id="C_C" class="p">▶ <small>Continue</small></div>
        <div id="C_S" class="p">▶ <small>Start</small></div>
        <div id="C_N" class="p">↓↓↓↓<small>Next</small></div>
        <div id="C_R">⟲ <small>Restart</small></div>
        <div id="C_X" class="a">✖<small>Menu</small></div>
      </div>
    </div>
    <div id="ctls" tabindex="0"></div>
  </body>
</html>
